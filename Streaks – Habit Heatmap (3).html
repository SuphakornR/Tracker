function openTodo(t){var due=t.due||'',pri=t.pri>=3?3:t.pri>=1?2:0,gone=false,armed=false,td=dk(now),tm=dk(add(now,1));

 open('<h2>To-do</h2><input type="text" id="te" maxlength="120" value="'+esc(t.t)+'" aria-label="Title" autocomplete="off" enterkeyhint="done" style="margin-top:-4px"><label>Priority</label><div class="trio" id="pr">'+[['Normal',0],['Important',2],['Urgent',3]].map(function(a){return '<button class="tg" data-i="'+a[1]+'" aria-pressed="'+(pri===a[1])+'">'+a[0]+'</button>'}).join('')+'</div><label>Due</label><div class="trio" id="du"><button class="tg">Today</button><button class="tg">Tomorrow</button><button class="tg">Pick date</button></div><input type="date" id="dd" value="'+due+'" aria-label="Pick a date" style="margin-top:10px" hidden><div class="grp" style="margin-top:18px"><button class="row" id="tf">Focus on this</button></div><div class="btns"><button class="btn" id="sv">Done</button></div><button class="lnk dng" id="dl">Delete to-do</button>',
  function(){if(gone)return;var v=$('#te')?$('#te').value.trim():'';if(v)t.t=v;t.pri=pri;t.due=due||'';save();renderTodo();drawTask()});
 chips();
 $('#pr').onclick=function(e){var b=e.target.closest('button');if(!b)return;pri=+b.dataset.i;$$('#pr button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})};
 $('#du').onclick=function(e){var b=e.target.closest('button');if(!b)return;var i=[].indexOf.call($$('#du button'),b);
  if(i===2){if(due===td||due===tm||!due)due=dk(add(now,2));chips();$('#dd').value=due;try{$('#dd').showPicker()}catch(x){}return}
  var v=i===0?td:tm;due=due===v?'':v;chips()};
 $('#dd').onchange=function(){due=this.value;chips()};
 $('#tf').onclick=function(){S.ft=t.id;close();drawTask();tab(2);toast('Focusing on “'+t.t.slice(0,28)+'”')};
