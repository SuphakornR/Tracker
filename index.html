.card{transition:transform .35s var(--ease),box-shadow .3s,background-color .45s var(--ease),opacity .3s}

.more{width:44px;height:44px;display:grid;place-items:center;margin-right:-6px}

.mv{gap:4px}

/* REMINDERS + SOUND SETTINGS */
var Rem=(function(){
var reg=null,last='',prev={},CK='streaks-data',CU='./__sched',isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
 standalone=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
function perm(){return window.Notification?Notification.permission:'unsupported'}
function rc(){return window.caches?caches.open(CK).then(function(c){return c.match(CU)}).then(function(r){return r?r.json():null}).catch(function(){return null}):Promise.resolve(null)}
function wc(o){return window.caches?caches.open(CK).then(function(c){return c.put(CU,new Response(JSON.stringify(o),{headers:{'Content-Type':'application/json'}}))}).catch(function(){}):Promise.resolve()}
function fmtT(t){try{return new Date('1970-01-01T'+t+':00').toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}catch(e){return t}}
function left(){return S.habits.filter(function(h){return dueToday(h)&&!done(h,TK)}).length}
function items(){var a=[],n;
 S.habits.forEach(function(h){if(h.rm){var s=hstreak(h);a.push({key:'h:'+h.id,kind:'h',time:h.rm,days:h.days||null,title:h.name,body:s?'Keep your '+s+'-day streak going.':'Time to check in.',sticky:!!h.rs})}});
 S.todos.forEach(function(t){if(t.tm&&!t.done&&t.due)a.push({key:'t:'+t.id,kind:'t',time:t.tm,date:t.due,title:t.t,body:'To-do reminder',sticky:!!t.rs})});
 if(S.rn.on){n=left();a.push({key:'daily',kind:'d',time:S.rn.time,days:null,title:'Streaks check-in',body:n?n+' habit'+(n>1?'s':'')+' left today.':'All habits done. Nice work.',sticky:!!S.rn.sticky})}
 return a}
function sched(){var skip={};S.habits.forEach(function(h){if(done(h,TK))skip['h:'+h.id]=TK});if(!left())skip.daily=TK;return{items:items(),skip:skip,fired:S.nf,snooze:S.nz}}
function pull(){return rc().then(function(c){if(!c)return;var f=c.fired||{};Object.keys(f).forEach(function(k){if(String(f[k]).indexOf(TK)===0)S.nf[k]=f[k]});S.nz=c.snooze||{}})}
function closeNote(k){try{reg&&reg.getNotifications({tag:k}).then(function(l){l.forEach(function(n){n.close()})})}catch(e){}}
function regPeriodic(){try{if(!(reg&&reg.periodicSync&&perm()==='granted'))return;if(S.rn.on||S.habits.some(function(h){return h.rm})||S.todos.some(function(t){return t.tm}))reg.periodicSync.register('streaks-remind',{minInterval:36e5}).catch(function(){})}catch(e){}}
function sync(force){Object.keys(S.nf).forEach(function(k){if(String(S.nf[k]).indexOf(TK)!==0)delete S.nf[k]});
 pull().then(function(){var s=sched(),j=JSON.stringify(s),act={};
  s.items.forEach(function(it){if(s.skip[it.key]!==TK)act[it.key]=1});Object.keys(prev).forEach(function(k){if(!act[k])closeNote(k)});prev=act;
  if(j===last&&!force)return;last=j;wc(s);regPeriodic()})}
function inApp(it){buzz([60,40,60]);toast('Reminder: '+it.title,it.kind==='x'?'':'Done',it.kind==='x'?null:function(){actDone(it.key)})}
function notify(it){var o={body:it.body,tag:it.key,renotify:true,icon:'icons/icon-192.png',badge:'icons/badge.png',requireInteraction:!!it.sticky,data:{k:it.key},timestamp:Date.now()};
 if(!document.hidden)Snd.chime('remind');
 if(perm()==='granted'){
  if(reg){if(it.kind!=='x')o.actions=it.kind==='d'?[{action:'snooze',title:'Snooze 10 min'}]:[{action:'done',title:'Done'},{action:'snooze',title:'Snooze 10 min'}];reg.showNotification(it.title,o).catch(function(){inApp(it)});return}
  try{new Notification(it.title,o);return}catch(e){}}
 inApp(it)}
function fire(it){S.nf[it.key]=TK+'@'+it.time;delete S.nz[it.key];save();notify(it)}
function check(){if(!window.Remind)return;if(!S.rn.on&&!S.habits.some(function(h){return h.rm})&&!S.todos.some(function(t){return t.tm&&!t.done})&&!Object.keys(S.nz).length)return;
 pull().then(function(){Remind.due(sched(),new Date(),180).forEach(fire)})}
function ensure(){var p=perm();if(p!=='default')return Promise.resolve(p);
 if(isIOS&&!standalone){toast('Add Streaks to your Home Screen to get notifications.');return Promise.resolve(p)}
 try{return Promise.resolve(Notification.requestPermission()).then(function(r){if(r==='denied')toast('Notifications are blocked for this site.');regPeriodic();return r})}catch(e){return Promise.resolve(p)}}
function arm(k,tm){var n=new Date();if(tm<=pad(n.getHours())+':'+pad(n.getMinutes()))S.nf[k]=TK+'@'+tm}
function snooze(k,m){S.nz[k]=Date.now()+m*60000;closeNote(k);save();return wc(sched())}
function actDone(k){var p=k.split(':'),id=p.slice(1).join(':');
 if(p[0]==='h'){var h=byId(id);if(!h)return;if(done(h,TK)){toast('Already done');return}if(!markDay(h,TK,true)){needFocus(h);return}save();refresh(h);buzz();Snd.chime('check');toast('Done: '+h.name)}
 else if(p[0]==='t'){var t=S.todos.find(function(x){return x.id===id});if(!t||t.done)return;setDone(t,true);save();renderTodo();buzz();Snd.chime('todo');toast('Done: '+t.t)}
 closeNote(k)}
function route(a,k){
 if(a==='new')openForm();else if(a==='focus')tab(2);else if(a==='todo'){tab(0);setTimeout(function(){$('#tn').focus()},300)}
 else if(a==='done'&&k)actDone(k);else if(a==='snooze'&&k){snooze(k,10);toast('Snoozed for 10 minutes')}}
function boot(){
 if('serviceWorker' in navigator){navigator.serviceWorker.ready.then(function(r){reg=r;regPeriodic()}).catch(function(){});
  navigator.serviceWorker.addEventListener('message',function(e){var d=e.data;if(d&&d.t==='act')route(d.a,d.k)})}
 var q=new URLSearchParams(location.search),a=q.get('a');if(a){route(a,q.get('k'));try{history.replaceState(null,'',location.pathname)}catch(e){}}
 var rg=function(){navigator.serviceWorker.register('sw.js').catch(function(){})};if('serviceWorker' in navigator&&location.protocol!=='file:'){if(document.readyState==='complete')rg();else addEventListener('load',rg)}
 sync(true);check();setInterval(check,20000);addEventListener('focus',check);document.addEventListener('visibilitychange',function(){if(!document.hidden)check()})}
function test(){ensure().then(function(){notify({key:'test',kind:'x',title:'Streaks',body:'Notifications are working.',sticky:!!S.rmd})})}
return{arm:arm,boot:boot,sync:sync,ensure:ensure,perm:perm,notify:notify,test:test,fmtT:fmtT,isIOS:isIOS,standalone:standalone}})();

function rmHTML(tm,rs){return '<label>Reminder <span class="lh">optional</span></label><div class="rmrow"><input type="time" id="rmt" aria-label="Reminder time" value="'+tm+'"><button class="tg" id="rmx">Clear</button></div><div class="chipset" id="rmq" style="margin-top:8px"><button class="tg" data-t="08:00">Morning</button><button class="tg" data-t="12:30">Midday</button><button class="tg" data-t="20:00">Evening</button></div><div class="grp" id="rmg" style="margin-top:12px"><button class="row swr" id="rms" role="switch" aria-checked="'+!!rs+'"><span>Sticky<small>Stays on screen until you dismiss it</small></span><i class="swt"></i></button></div>'}
function rmWire(st,cb){var t=$('#rmt'),g=$('#rmg');function sh(){g.hidden=!st.tm;cb&&cb()}
 t.oninput=t.onchange=function(){st.tm=TRE.test(t.value)?t.value:'';sh()};
 $('#rmx').onclick=function(){t.value='';st.tm='';sh()};
 $('#rmq').onclick=function(e){var b=e.target.closest('button');if(!b)return;t.value=st.tm=b.dataset.t;sh()};
 $('#rms').onclick=function(){st.rs=!st.rs;this.setAttribute('aria-checked',st.rs)};sh()}

function tgl(b){var v=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',v);return v}

function openRem(){var n=S.rn,p=Rem.perm();
 var st=p==='granted'?'Notifications are on.':p==='denied'?'Notifications are blocked. Allow them for this site in your browser or phone settings.':p==='unsupported'?'This browser doesn’t support notifications.':'Notifications are off. Turn them on to get habit and to-do reminders.';
 var note=(Rem.isIOS&&!Rem.standalone?'On iPhone and iPad, add Streaks to your Home Screen first. Notifications only work from there. ':'')+(Rem.isIOS?'iOS ignores “sticky”, so you’ll still get the alert but it won’t stay. ':'Sticky reminders stay on screen until you dismiss them. ')+'Reminders arrive while Streaks is open or running in the background. When it’s fully closed, delivery depends on your device.';
 open('<h2>Reminders</h2><p class="mt">'+st+'</p>'+(p==='default'?'<div class="btns" style="margin-top:12px"><button class="btn" id="ren">Turn on notifications</button></div>':'')
  +'<p class="mt" style="margin-top:14px;font-size:13px">Set a reminder time on any habit or to-do. Here’s a general one.</p><div class="grp" style="margin-top:10px">'+sw('rdy','Daily check-in','A nudge while habits are still open',n.on)+'<div class="row rmrow" id="rdr"><span style="flex:1;font-weight:600">Time</span><input type="time" id="rdt" aria-label="Check-in time" value="'+n.time+'"></div>'+sw('rds','Sticky check-in','Stays until you dismiss it',n.sticky)+sw('rsd','Sticky by default','For new habit and to-do reminders',S.rmd)+'</div>'
  +'<div class="grp" style="margin-top:12px"><button class="row" id="rts">Send a test notification</button></div><p class="note">'+note+'</p><div class="btns"><button class="btn ghost" id="sx">Back</button></div>');
 var dr=function(){$('#rdr').hidden=!S.rn.on;$('#rds').hidden=!S.rn.on};dr();
 if($('#ren'))$('#ren').onclick=function(){Rem.ensure().then(openRem)};
 $('#rdy').onclick=function(){S.rn.on=tgl(this);save();dr();if(S.rn.on)Rem.ensure()};

 $('#rsd').onclick=function(){S.rmd=tgl(this);save()};
 $('#rts').onclick=function(){Rem.test()};$('#sx').onclick=openSettings}

 open('<h2>Sound &amp; music</h2><label>Music</label><div class="chipset" id="sm">'+[['off','Off'],['cozy','Cozy lo-fi'],['rain','Rainy window'],['drift','Drift']].map(function(a){return '<button class="tg" data-m="'+a[0]+'" aria-pressed="'+(s.m===a[0])+'">'+a[1]+'</button>'}).join('')+'</div><label>Volume</label><input type="range" class="vol" id="vl" min="0" max="100" value="'+s.v+'" aria-label="Volume"><div class="grp" style="margin-top:18px">'+sw('sfx','Sound effects','Soft chimes for check-ins, to-dos and timers',s.fx)+sw('sau','Play while timer runs','Music starts and stops with Focus',s.auto)+'</div><p class="note">Music is generated on your device, so it works offline and never repeats exactly.</p><div class="btns"><button class="btn ghost" id="sx">Back</button></div>');
